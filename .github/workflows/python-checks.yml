name: Python checks
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/python-checks.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/python-checks.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
