name: Python checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/catalog/**'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/catalog/**'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
